<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>WHENMUSIC</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="card.css">
</head>
<body>

<div id="card" class="card" data-state="empty">
  <div class="art" id="art"></div>
  <!-- 전면 덮개가 아니라 왼쪽에서 오른쪽으로 빠지는 띠 — 글자가 놓인 쪽만 덮는다 (D-09) -->
  <div class="veil"></div>

  <div class="body">
    <div class="meta">
      <div class="t" id="title">재생 중인 것이 없습니다</div>
      <div class="a" id="sub">Spotify·유튜브·플레이어에서 재생을 시작하면 여기 뜹니다</div>
    </div>

    <div class="row">
      <span class="src" id="src" hidden><span class="d"></span><span id="app"></span></span>
      <div class="ctl">
        <button data-act="back" title="10초 되감기 (Ctrl+Alt+←)" aria-label="10초 되감기">
          <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 11-6 6H4a8 8 0 108-8z"/></svg>
        </button>
        <button data-act="toggle" class="big" title="재생 / 일시정지" aria-label="재생 또는 일시정지">
          <svg id="icon-toggle" viewBox="0 0 24 24"><path d="M8 5h3v14H8zm5 0h3v14h-3z"/></svg>
        </button>
        <button data-act="stamp" class="stamp" title="이 순간 표시 (Ctrl+Alt+S)" aria-label="이 순간 표시">
          <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5 4.7 1.3 6.8L12 17.3 5.9 20.6 7.2 13.8l-5-4.7 6.9-.8z"/></svg>
        </button>
      </div>
    </div>

    <div class="row bar-row" id="progress">
      <span class="tm" id="now">0:00</span>
      <div class="bar" id="bar"><i id="fill"></i></div>
      <span class="tm" id="dur">0:00</span>
    </div>
  </div>
</div>

<script src="card.js" type="module"></script>
</body>
</html>
