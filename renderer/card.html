<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>WHENMUSIC</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="card.css">
</head>
<body>

<div id="card" class="card" data-state="empty">
  <div class="art" id="art"></div>
  <!-- 접혀 있을 때 원 둘레가 진행바가 된다. 펼치면 아래 진행바에 자리를 내준다 -->
  <svg class="ring" id="ring" viewBox="0 0 56 56" aria-hidden="true">
    <circle class="ring-bg" cx="28" cy="28" r="25.5"></circle>
    <circle class="ring-fill" id="ringFill" cx="28" cy="28" r="25.5"></circle>
  </svg>
  <!-- 전면 덮개가 아니라 왼쪽에서 오른쪽으로 빠지는 띠 — 글자가 놓인 쪽만 덮는다 (D-09) -->
  <div class="veil"></div>

  <div class="body">
    <!-- 호버할 때만 펼쳐진다 (CARD-08). 이전·다음은 자주 쓰는 동작이 아니라
         평소 자리를 차지할 이유가 없다 (CTL-02) -->
    <div class="extra" id="extra">
      <div class="stamp-list" id="stampList">표시해 둔 순간이 없습니다</div>
      <div class="ctl skip">
        <button data-act="prev" title="이전" aria-label="이전">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button data-act="next" title="다음" aria-label="다음">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
        </button>
      </div>
    </div>

    <div class="meta">
      <div class="t" id="title">재생 중인 것이 없습니다</div>
      <div class="a" id="sub">Spotify·유튜브·플레이어에서 재생을 시작하면 여기 뜹니다</div>
    </div>

    <div class="row">
      <button class="src" id="src" hidden title="제어할 세션 바꾸기"><span class="d"></span><span id="app"></span></button>
      <div class="ctl">
        <button data-act="back" title="10초 되감기 (Ctrl+Alt+←)" aria-label="10초 되감기">
          <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 11-6 6H4a8 8 0 108-8z"/></svg>
        </button>
        <button data-act="toggle" class="big" title="재생 / 일시정지" aria-label="재생 또는 일시정지">
          <svg id="icon-toggle" viewBox="0 0 24 24"><path d="M8 5h3v14H8zm5 0h3v14h-3z"/></svg>
        </button>
        <button data-act="stamp" class="stamp" title="이 순간 표시 (Ctrl+Alt+S)" aria-label="이 순간 표시">
          <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5 4.7 1.3 6.8L12 17.3 5.9 20.6 7.2 13.8l-5-4.7 6.9-.8z"/></svg>
        </button>
      </div>
    </div>

    <div class="row bar-row" id="progress">
      <span class="tm" id="now">0:00</span>
      <div class="bar" id="bar"><i id="fill"></i></div>
      <span class="tm" id="dur">0:00</span>
    </div>
  </div>
</div>

<script src="card.js" type="module"></script>
</body>
</html>
